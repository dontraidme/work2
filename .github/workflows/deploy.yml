name: Full Stack Application Deployment Test

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create env file from secrets
        shell: powershell
        run: |
          @"
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          APP_PORT=${{ secrets.APP_PORT }}
          COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }}
          "@ | Out-File -FilePath .env -Encoding utf8

      - name: Deploy with Docker Compose
        shell: powershell
        run: |
          docker compose up -d --build
          Start-Sleep -Seconds 15
          docker compose ps

      - name: Verify containers are running
        shell: powershell
        run: |
          $psResult = docker compose ps
          if ($psResult -match "running" -or $psResult -match "Up") {
              echo "Containers are Up"
          } else {
              docker compose logs
              exit 1
          }

      - name: Run application tests
        shell: powershell
        run: |
          $port = "${{ secrets.APP_PORT }}"
          try {
              $response = Invoke-WebRequest -Uri "http://localhost:$port/" -UseBasicParsing -TimeoutSec 5
              echo "App is healthy"
          } catch {
              echo "App is unreachable"
              exit 1
          }

      - name: Create test report
        shell: powershell
        run: |
          $date = Get-Date
          @"
          # Deployment Test Report
          - Date: $date
          - Status: Success
          "@ | Out-File -FilePath test-report.md -Encoding utf8

      - name: Save Docker logs and state
        if: always()
        shell: powershell
        run: |
          docker compose logs | Out-File -FilePath deployment-logs.txt -Encoding utf8
          docker ps -a | Out-File -FilePath docker-ps.txt -Encoding utf8

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
            deployment-logs.txt
            docker-ps.txt
          retention-days: 7
